name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas y compilación
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest assembleRelease > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Could not|Unresolved|Exception|Caused by" -A3 build.log | head -c 6000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falló la compilación::${msg}"
          fi
          exit $code

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "Musica-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La versión $TAG ya existe. Sube appVersion en app/build.gradle.kts para publicar otra."
          else
            gh release create "$TAG" "Musica-$VERSION.apk" \
              --title "Música $VERSION" \
              --notes "Versión $VERSION"
          fi
