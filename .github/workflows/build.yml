name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas y compilación
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "Musica-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La versión $TAG ya existe. Sube versionName para publicar otra."
          else
            gh release create "$TAG" "Musica-$VERSION.apk" \
              --title "Música $VERSION" \
              --notes "Versión $VERSION"
          fi
